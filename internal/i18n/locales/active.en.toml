# active.en.toml is the reference catalogue: every id here must exist in
# every other shipped language's file, and no other file may define an id
# this one lacks (internal/i18n/catalogue_test.go).

[language.name]
description = "This file's own language, as it names itself in the language switcher"
other = "English"

# --- nav ---------------------------------------------------------------

[nav.timeline]
description = "Primary navigation: the timeline link"
other = "Timeline"

[nav.medications]
description = "Primary navigation: the medications link"
other = "Medications"

[nav.settings]
description = "Primary navigation: the settings link"
other = "Settings"

# --- settings.language -------------------------------------------------

[settings.language.label]
description = "The settings page's language preference control"
other = "Language"

[settings.language.description]
description = "Hint text under the language control, explaining what it changes"
other = "The language this account is shown in."

# --- error.<Failure.Code wire value> ------------------------------------

[error.unauthenticated]
description = "401: no valid session"
other = "sign in to continue"

[error.forbidden]
description = "403: a resource whose existence the caller already knows"
other = "that is not something this account may do"

[error.not_found]
description = "404: not there, or an authorization failure on owner-scoped data"
other = "not found"

[error.version_mismatch]
description = "412: If-Match did not match"
other = "this changed since you last read it"

[error.validation_failed]
description = "422: one or more submitted fields were rejected"
other = "one or more fields were rejected"

[error.conflict]
description = "409: the change conflicts with something already recorded"
other = "that conflicts with something already recorded"

[error.registration_closed]
description = "403: this instance is not open for registration"
other = "this instance is not open for registration"

[error.invalid_token]
description = "400: a recovery or confirmation link is expired, used or tampered with"
other = "that link is no longer usable; request another"

[error.mail_unconfigured]
description = "503: this instance has no outgoing mail configured"
other = "this instance cannot send mail; ask an operator"

[error.invalid_cursor]
description = "400: a pagination cursor this instance did not issue"
other = "that page reference is not one this instance issued"

[error.rate_limited]
description = "429: too many requests"
other = "too many requests; try again shortly"

[error.client_closed]
description = "499: the request was cancelled by the client"
other = "the request was cancelled"

[error.timeout]
description = "504: the request took too long"
other = "the request took too long"

[error.unsupported_media_type]
description = "415: an uploaded file's type is not accepted"
other = "that file type is not accepted"

[error.payload_too_large]
description = "413: an uploaded file exceeds the size limit"
other = "that file is too large"

[error.bad_request]
description = "400: a request PocketBase refused before any MediKube handler saw it"
other = "the request could not be processed"

[error.patient_required]
description = "400: a patient-scoped list or stream with no ?patient= named"
other = "name the patient this request is for"

[error.self_record_protected]
description = "409: an attempt to delete a self-record; closing the account is the only way"
other = "closing the account is what removes a self-record; there is no separate delete for it"

[error.duplicate_name]
description = "409: a tag name that already exists for this owner"
other = "a tag under that name already exists"

[error.internal_error]
description = "500 and any other code this instance does not recognise"
other = "internal error"

# --- empty ---------------------------------------------------------------

[empty.nothing_recorded]
description = "Shown under a kind's list when the patient has none of that kind yet"
other = "Nothing recorded yet"

[empty.nothing_matches]
description = "Shown when a search or filter narrows a list to zero results"
other = "Nothing matches"

# --- action ---------------------------------------------------------------

[action.save]
description = "The submit button on a create or edit form"
other = "Save"

[action.cancel]
description = "The button that discards a form without submitting it"
other = "Cancel"

[action.delete]
description = "The button that opens a delete confirmation"
other = "Delete"

# --- confirm ---------------------------------------------------------------

[confirm.delete_permanently]
description = "The delete confirmation dialog's question"
other = "Delete permanently?"

[confirm.keep_it]
description = "The delete confirmation dialog's cancel option"
other = "Keep it"

# --- kind.<kind>.one / .other ------------------------------------------
# A kind's own display name with a count (D-06): produced from kind.Kind.Enum(),
# never a hand-written switch. en needs only one/other (data-model.md §4);
# pl additionally needs few/many.

