# GitHub workflow syntax breaks two yamllint defaults that are not worth fighting:
# `on:` is a YAML 1.1 boolean, and workflow expressions do not wrap.
extends: default

# The browser gate's installed packages. `npm ci` puts several thousand YAML
# files under e2e/node_modules, none of them this repository's, and one of them
# is enough to fail --strict. They are gitignored; this is the same exclusion,
# stated where yamllint can read it.
ignore: |
  e2e/node_modules/

rules:
  truthy:
    allowed-values: ["true", "false"]
    check-keys: false
  line-length:
    max: 120
    allow-non-breakable-words: true
  comments:
    min-spaces-from-content: 1
  document-start: disable
  # A workflow's `jobs:` block is conventionally indented under its parent; the
  # default requires consistency, not a particular style.
  indentation:
    spaces: consistent
    indent-sequences: consistent
