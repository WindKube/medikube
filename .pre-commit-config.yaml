# The local mirror of CI, so a push is not the first place a failure shows up.
# Install with `task hooks:install`.
#
# Every rev is pinned and kept in step with mise.toml, so the hook and the
# command in the Taskfile are the same tool at the same version. `task
# hooks:update` moves them.
minimum_pre_commit_version: "4.0.0"

default_install_hook_types: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: detect-private-key
      # design/source/ is an imported comp plus the runtime it was exported with.
      # It is stored byte-for-byte as the design tool emitted it so it can be
      # re-imported; reformatting it would make the round trip a diff.
      - id: end-of-file-fixer
        exclude: ^design/source/
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^design/source/
      - id: trailing-whitespace
        exclude: ^design/source/

  # --- secrets -------------------------------------------------------------
  # Staged-diff scan. CI runs TruffleHog over the full history as well, because a
  # hook only ever sees the commits made on a machine that had it installed.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # --- YAML ----------------------------------------------------------------
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict, -c, .yamllint.yaml]

  # --- GitHub Actions ------------------------------------------------------
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint-system

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.29.0
    hooks:
      - id: zizmor
        # Matches the CI gate in .github/workflows/security.yaml. `regular` hides
        # the excessive-permissions class.
        args: [--no-progress, --persona=pedantic]

  # --- Markdown ------------------------------------------------------------
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2

  # --- shell ---------------------------------------------------------------
  # language: system rather than pre-commit's own shellcheck mirror, so the hook
  # and `task lint:shell` are the one binary mise pins. .shellcheckrc applies.
  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types: [shell]

  # --- the spec corpus itself ----------------------------------------------
  # always_run on both, because these assertions are whole-corpus: a link breaks
  # when its target is renamed or deleted, which is a change to a file the hook
  # would never be handed. Together they take well under a second.
  - repo: local
    hooks:
      - id: spec-structure
        name: spec corpus structure
        entry: scripts/check-spec-structure.sh
        language: script
        always_run: true
        pass_filenames: false

      # Whole-corpus for the same reason: the old name can reappear in any file,
      # including one this commit does not touch.
      - id: check-naming
        name: the old project name is gone
        entry: scripts/check-naming.sh
        language: script
        always_run: true
        pass_filenames: false

      # The half check-spec-structure.sh cannot do: cross-file heading anchors.
      # A renamed heading breaks every `#d-NN` citation pointing at it and
      # nothing else in this list would notice.
      - id: lychee
        name: link integrity
        entry: lychee --config lychee.toml --no-progress --offline .
        language: system
        always_run: true
        pass_filenames: false
