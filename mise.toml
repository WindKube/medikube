# The dev toolchain. `mise install` gets you everything the Taskfile and the
# pre-commit hooks expect on PATH.
#
# No Go, and no version of it: this repository is specifications and design.
# `go build` would have nothing to compile, so the three tiers are linting,
# link integrity, and the structural assertions in scripts/.
[tools]
task = "3.53.1"
pre-commit = "4.6.2"

# All five also run in CI. Pinned rather than floating so a finding is a finding
# in both places — a linter that silently gains a rule on the runner turns a
# green branch red for reasons nobody changed.
actionlint = "1.7.12"
zizmor = "1.29.0"
yamllint = "1.38.0"
shellcheck = "0.11.0"
lychee = "0.24.2"

# markdownlint-cli2 ships only as an npm package, so node is here to host it and
# for nothing else.
node = "24.19.0"
"npm:markdownlint-cli2" = "0.23.2"
