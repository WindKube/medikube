# The dev toolchain. `mise install` gets you everything the Taskfile and the
# pre-commit hooks expect on PATH.
[tools]
# 1.27, not the 1.26.5 the rest of the house is on: PocketBase v0.40.1 imports
# encoding/json/v2 and does not compile on anything older. The authoritative
# copy of this number is go.mod's `toolchain` line — this one only saves the
# shim a toolchain download. golangci-lint is deliberately absent: it has to be
# built by this toolchain, which `task install:golangci-lint` does.
go = "1.27.0"

task = "3.53.1"
pre-commit = "4.6.2"

# All five also run in CI. Pinned rather than floating so a finding is a finding
# in both places — a linter that silently gains a rule on the runner turns a
# green branch red for reasons nobody changed.
actionlint = "1.7.12"
zizmor = "1.29.0"
yamllint = "1.38.0"
shellcheck = "0.11.0"
lychee = "0.24.2"

# markdownlint-cli2 ships only as an npm package, so node is here to host it and
# for nothing else.
node = "24.19.0"
"npm:markdownlint-cli2" = "0.23.2"
